name: atlas-monitor
# Daily production check of every published Atlas URL plus a sample of eSIM
# URLs on livdar.com, and a stale data check. Fails loudly; it never edits the
# site by itself.
on:
  schedule: [{ cron: '30 6 * * *' }]
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/atlas/monitor.mjs
      - run: node scripts/atlas/reconcile.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: atlas-monitor, path: reports/atlas/monitor-*.json }
