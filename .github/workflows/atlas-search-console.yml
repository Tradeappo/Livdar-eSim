name: atlas-search-console
# Imports Search Console data and separates the four things that are usually
# confused: discovered, indexed, impressions and clicks. Requesting indexing is
# recorded elsewhere and is never counted as indexing.
#
# Authentication is Workload Identity Federation. The job's GitHub OIDC token is
# exchanged for a short lived token of the Search Console service account, and
# no key exists anywhere: not in the repository, not in a secret. The pool only
# trusts this repository, on main, running this workflow file.
#
# Fail closed. The step used to read `node scripts/gsc-report.mjs || echo
# "...skipping"`, and its one scheduled run reported success after failing in
# 0.03 seconds. Now every one of these fails the job: federation not configured,
# federation refused, the property refusing the service account, an API call
# failing. There is no skipped-but-green path left.
#
# URL INSPECTION is a separate, opt-in step on the same credentials. Search Analytics answers
# "was this page shown"; only URL Inspection answers "is this page indexed", and the cohort has
# 500 live URLs with zero impressions over six weeks, which is not the same fact. The step is
# gated behind a dispatch input and is OFF on the daily schedule, so the import that works
# today keeps working exactly as it does and nothing new can fail it unattended. When it is
# asked for, it fails loudly like every other step here.
on:
  schedule: [{ cron: '30 5 * * *' }]
  workflow_dispatch:
    inputs:
      inspect_urls:
        description: 'Also run URL Inspection over the live cohort (uses Search Console quota, 2,000/day/property)'
        type: boolean
        default: false
      inspect_limit:
        description: 'Inspect at most this many URLs, 0 for all 500. The order is round robin across families, so a smaller number is still a stratified sample.'
        type: string
        default: '0'
permissions:
  contents: write        # the import commits the measured file to a branch
  pull-requests: write   # and opens the pull request for it
  id-token: write        # the OIDC token that Workload Identity Federation exchanges
env:
  GSC_PROPERTY: ${{ secrets.GSC_PROPERTY }}
jobs:
  import:
    runs-on: ubuntu-latest
    # 180, not 30. Run 21 on 2026-10-10 was CANCELLED at exactly 30 minutes 19 seconds with
    # the URL Inspection step still going: the API answers in about 3.4 seconds per URL, so
    # 500 of them is roughly half an hour of waiting on Google and the old limit could not fit
    # it. The daily scheduled import finishes in one to two minutes and is unaffected by a
    # larger ceiling; a ceiling only bites the step that needs the time.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      # Named rather than discovered, so a missing variable fails here with its
      # name instead of as an opaque auth error further down.
      - name: Federation is configured
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GSC_SERVICE_ACCOUNT }}
        run: |
          missing=""
          [ -n "$WIF_PROVIDER" ] || missing="$missing GCP_WIF_PROVIDER(variable)"
          [ -n "$WIF_SERVICE_ACCOUNT" ] || missing="$missing GSC_SERVICE_ACCOUNT(variable)"
          [ -n "$GSC_PROPERTY" ] || missing="$missing GSC_PROPERTY(secret)"
          if [ -n "$missing" ]; then echo "::error::Search Console is not configured:$missing"; exit 1; fi

      # Writes an external_account credentials file and points
      # GOOGLE_APPLICATION_CREDENTIALS at it. No key is created.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GSC_SERVICE_ACCOUNT }}

      # Configured, authorised and granted are three different questions with
      # three different remedies, so they are answered separately and written
      # into the job summary. --ci exits 1 unless the property answered. The
      # output lives in RUNNER_TEMP, outside the checkout, so the import pull
      # request can never pick it up.
      - name: Preflight
        run: |
          set -o pipefail
          node scripts/gsc-check.mjs --ci | tee "$RUNNER_TEMP/gsc-check.json"
          { echo '### Search Console'; echo '```json'; cat "$RUNNER_TEMP/gsc-check.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - run: node scripts/gsc-report.mjs

      - run: node scripts/atlas/gsc-import.mjs --write --ci

      # Per-URL index state. Same credentials, same scope, same property: no service account
      # is created, no key exists and the federation setup is untouched. The one permission
      # this needs beyond Search Analytics is a Search Console property role of OWNER or FULL
      # rather than RESTRICTED; a 403 here says exactly that and stops the run instead of
      # retrying, because no retry can fix a permission.
      - name: URL Inspection over the live cohort
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_urls }}
        run: |
          set -o pipefail
          node scripts/atlas/gsc-url-inspection.mjs --write --qps 8 \
            --limit "${{ inputs.inspect_limit }}" | tee "$RUNNER_TEMP/url-inspection.json"
          { echo '### URL Inspection'; echo '```json'; \
            cat "$RUNNER_TEMP/url-inspection.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # always(), for the same reason the pull request step has it: a partial inspection is
      # still evidence, and the report should describe what was obtained rather than be
      # skipped because the step before it ran out of clock.
      - name: Rebuild the indexation report from whatever evidence is now on disk
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.inspect_urls }}
        run: python3 scripts/atlas/analysis/indexation-report.py

      # if: always(), and that is the lesson from run 21. The inspection step was cancelled at
      # the job timeout, this step was SKIPPED because it only ran on success, and several
      # hundred inspections' worth of Search Console quota was spent and then thrown away. The
      # client checkpoints to disk every few URLs and resumes from whatever is already there,
      # but resume can only see a file that was committed. So the evidence is committed whether
      # the run succeeded, failed or was cancelled, and the job still goes red on its own
      # merits: preserving what was paid for is not the same as passing.
      - uses: peter-evans/create-pull-request@v6
        if: always()
        with:
          branch: atlas/search-console
          title: 'Atlas Search Console import'
          commit-message: 'Atlas Search Console import'
          body: |
            Discovered, indexed, impressions and clicks, counted separately.

            If this pull request arrived from a run that failed or was cancelled, it carries
            the PARTIAL evidence that run paid for in quota. Re-running the workflow resumes
            from these rows rather than re-spending them.

      # Named last and gated on failure, so a red run says in one line what to do next instead
      # of leaving the reader to open the log.
      - name: Why the run is red
        if: failure() || cancelled()
        run: |
          echo "::warning::The run did not complete. Any URL Inspection rows it did obtain are"
          echo "::warning::in the atlas/search-console pull request; re-run the workflow with"
          echo "::warning::inspect_urls true to resume from them rather than re-spend quota."
          exit 1
